name: test_flutter_app
description: A test Flutter app for Hatch
version: 1.0.0
sdk:
  flutter: 3.35.2
  dart: '>=3.5.0 <4.0.0'
require:
  provider: ^6.0.0
  http: ^1.0.0
  cupertino_icons: ^1.0.0
require-dev:
  mockito: ^5.4.0
  flutter_test: '{ "sdk": "flutter" }'
profiles:
  test:
    require:
      integration_test: '{ "sdk": "flutter" }'
    require-dev: null
    scripts: null
  dev:
    require:
      flutter_lints: ^3.0.0
    require-dev: null
    scripts: null
submodules: null
repositories: null
build: null
scripts:
  pre-install: "echo Starting installation..."
  post-install: "echo Installation complete!"
  test: "flutter test"
  build: "flutter build apk"
  clean: "flutter clean"
