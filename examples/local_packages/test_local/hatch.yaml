name: test_local_app
description: Test app with local packages and overrides

sdk:
  flutter: "3.35.2"
  dart: ">=3.5.0 <4.0.0"

require:
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  http: ^1.5.0
  my_local_package: any

local-packages:
  my_local_package: "../my_package"

overrides:
  path:
    force-version: "1.9.0"
  collection:
    path: "../collection_fork"