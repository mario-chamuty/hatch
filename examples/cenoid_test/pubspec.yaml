name                  : cenoid
description           : "A new Flutter project."
publish_to            : 'none' # Remove this line if you wish to publish to pub.dev
version               : 1.0.0+1

environment           :
  sdk: '>=3.5.0 <4.0.0'

dependencies          :
  flutter                    :
    sdk: flutter
  flutter_localizations      :
    sdk: flutter

  #UI Elements
  cupertino_icons            : ^1.0.8
  gradient_icon              : ^2.0.9
  google_maps_flutter        : ^2.13.1
  floating_overlay           : ^1.2.1
  cached_network_image       : ^3.4.1
  google_fonts               : ^6.3.1
  flutter_svg                : ^2.2.1
  intl                       : ^0.20.2
  loading_animation_widget   : ^1.3.0
  shimmer                    : ^3.0.0

  # Animations and modern UI
  flutter_animate            : ^4.5.0
  lottie                     : ^3.1.2
  animations                 : ^2.0.11
  flutter_staggered_animations: ^1.1.1
  animate_do                 : ^3.3.4
  rive                       : ^0.13.13
  flutter_blurhash           : ^0.8.2
  glassmorphism              : ^3.0.0

  # Charts and data visualization
  fl_chart                   : ^0.69.0

  #auth
  google_sign_in             : ^7.1.1
  flutter_facebook_auth      : ^7.1.2
  sign_in_with_apple         : ^6.1.2

  #tools, helpers
  overlay_support            : ^2.1.0
  flutter_secure_storage     : ^9.2.4
  uuid                       : ^4.5.1
  location                   : ^8.0.1
  flutter_native_splash      : ^2.4.6
  shared_preferences         : ^2.5.3
  firebase_core              : ^4.1.0
  firebase_messaging         : ^16.0.1
  flutter_local_notifications: ^19.4.2
  permission_handler         : ^12.0.1
  url_launcher               : ^6.3.2
  mobile_scanner             : ^6.0.2
  image_picker               : ^1.1.2
  flutter_image_compress     : ^2.3.0
  qr_flutter                 : ^4.1.0
  share_plus                 : ^10.1.2
  visibility_detector        : ^0.4.0+2
  video_player               : ^2.8.3
  carousel_slider            : ^4.2.1

  #state management
  get                        : ^4.7.2
  get_storage                : ^2.1.1

  #api
  http                       : ^1.5.0
  dio                        : ^5.9.0

  logger: any
dev_dependencies      :
  flutter_test          :
    sdk: flutter
  faker                 : ^2.2.0
  flutter_lints         : ^6.0.0
  flutter_launcher_icons: ^0.14.4
  dartssh2              : ^2.13.0

  yaml: any
flutter               :
  uses-material-design: true

  assets              :
    - "assets/"
    - "assets/images/"
    - "locale/i18n_sk.json"

flutter_launcher_icons:
  android                 : true
  ios                     : true
  image_path              : "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android         : 21
  remove_alpha_ios        : true
  web                     :
    generate        : false
    image_path      : "assets/images/icon.png"
    background_color: "#ffffff"
    theme_color     : "#ffffff"
  windows                 :
    generate  : false
    image_path: "assets/images/icon.png"
    icon_size : 48
  macos                   :
    generate  : false
    image_path: "assets/images/icon.png"

flutter_native_splash :
  color           : "#ffffff"
  image           : assets/images/logo_simple_centered.png
  android         : true
  ios             : true

  web             : false
  android_gravity : center
  ios_content_mode: center

scripts               :
  splash_screen     : "fvm dart run flutter_native_splash:create"
  launcher_icons    : "fvm dart run flutter_launcher_icons"
  build_dependencies: "fvm flutter pub run build_runner build --delete-conflicting-outputs"
  setup_firebase    : "flutterfire configure" # https://firebase.flutter.dev/docs/cli/