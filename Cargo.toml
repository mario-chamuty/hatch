[package]
name = "hatch"
version = "0.1.0"
edition = "2021"
authors = ["Version Two s.r.o. <info@versiontwo.sk>", "Mario Chamuty"]
description = "Fast, Rust-powered dependency and build manager for Flutter, with Mac-free iOS builds"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/mario-chamuty/hatch"
repository = "https://github.com/mario-chamuty/hatch"
keywords = ["flutter", "dependency-management", "build-tools", "ios", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hatch"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "color", "suggestions"] }

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Async runtime and HTTP client
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }

# Version and dependency management
semver = { version = "1.0", features = ["serde"] }

# File system and path handling
dirs = "5.0"
home = "0.5"
walkdir = "2.4"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Terminal UI and progress
indicatif = "0.17"
console = "0.15"
colored = "2.0"

# Configuration and caching
config = "0.13"
serde_derive = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
async-trait = "0.1.89"
once_cell = "1.19"

# Compression and archive handling
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
futures-util = "0.3"
futures = "0.3"

# Dependency resolution
pubgrub = "0.2"
bitvec = "1"
blake3 = "1"

# Path globbing for per-package .hatch.json keep/strip lists
glob = "0.3"

# Shell-safe argv splitting (no metachar interpretation)
shell-words = "1"

# Graph algorithms (independent-subgraph parallelism)
petgraph = "0.6"
rayon = "1"

# iOS: App Store Connect API auth (ES256 JWT) + base64 transport
jsonwebtoken = "9"
base64 = "0.22"
# iOS publish: read the .ipa (zip), build the binary AppStoreInfo.plist, MD5 checksums
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1.7"
md-5 = "0.10"
# iOS Assets.car (native, Mac-free): PNG decode + Apple-reference LZFSE (byte-identical
# to the `lzfse` CLI used in the proven build-41 transplant path)
image = { version = "0.24", default-features = false, features = ["png"] }
lzfse = "0.2"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
wiremock = "0.5"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"

[[bench]]
name = "resolver"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.winres]
OriginalFilename = "hatch.exe"
ProductName = "Hatch"
FileDescription = "Fast dependency and build manager for Flutter, with Mac-free iOS builds"
LegalCopyright = "Copyright © 2026 Version Two s.r.o."

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
image = "0.24"
