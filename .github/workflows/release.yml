name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  resolve-version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "tag '$tag' does not look like vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: stage artefacts
        id: stage
        shell: bash
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          target="${{ matrix.target }}"
          stem="hatch-${version}-${target}"
          out="dist"
          mkdir -p "$out"

          bin="hatch"
          ext=""
          if [[ "$target" == *windows* ]]; then
            ext=".exe"
          fi

          src="target/${target}/release/${bin}${ext}"
          if [[ ! -f "$src" ]]; then
            echo "expected binary at $src not found" >&2
            ls -R target/${target}/release || true
            exit 1
          fi

          stage="$out/$stem"
          mkdir -p "$stage"
          cp "$src" "$stage/${bin}${ext}"
          cp README.md LICENSE* CHANGELOG.md "$stage/" 2>/dev/null || true

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd "$out" && 7z a -tzip "${stem}.zip" "${stem}" >/dev/null)
            asset="${stem}.zip"
          else
            tar -C "$out" -czf "$out/${stem}.tar.gz" "${stem}"
            asset="${stem}.tar.gz"
          fi
          rm -rf "$stage"

          (cd "$out" && \
            if command -v sha256sum >/dev/null; then \
              sha256sum "$asset" > "${asset}.sha256"; \
            else \
              shasum -a 256 "$asset" > "${asset}.sha256"; \
            fi)

          echo "asset=$asset" >>"$GITHUB_OUTPUT"

      - name: upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: hatch-${{ matrix.target }}
          path: |
            dist/${{ steps.stage.outputs.asset }}
            dist/${{ steps.stage.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hatch-*
          merge-multiple: true

      - name: combined SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          : > SHA256SUMS
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS
          done
          ls -la

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/hatch-*.tar.gz
            dist/hatch-*.zip
            dist/SHA256SUMS
